{% extends "base.html" %}
{% block title %}Settings - C-Call{% endblock %}
{% block content %}
<section class="settings-hero">
  <div>
    <p class="eyebrow">Local configuration</p>
    <h1>SIP settings</h1>
    <p>Save the SIP account this self-hosted instance should use for outbound calls. The password stays in the local app database under <code>instance/</code>.</p>
  </div>
</section>

<section class="tool-panel settings-panel">
  <form method="post" class="form">
    <div class="split">
      <label>SIP domain <input name="SIP_DOMAIN" value="{{ settings.SIP_DOMAIN }}" placeholder="sip.example.com" required></label>
      <label>SIP port <input name="SIP_PORT" value="{{ settings.SIP_PORT or '5060' }}" inputmode="numeric" required></label>
    </div>
    <label>SIP user <input name="SIP_USER" value="{{ settings.SIP_USER }}" autocomplete="off" required></label>
    <label>Dial format
      <select name="ASTERISK_DIAL_FORMAT">
        <option value="e164_noplus" {% if dial_format == "e164_noplus" %}selected{% endif %}>88017XXXXXXXX</option>
        <option value="e164" {% if dial_format == "e164" %}selected{% endif %}>+88017XXXXXXXX</option>
        <option value="local_bd" {% if dial_format == "local_bd" %}selected{% endif %}>017XXXXXXXX</option>
        <option value="raw" {% if dial_format == "raw" %}selected{% endif %}>Use normalized input</option>
      </select>
    </label>
    <label>SIP password <input name="SIP_PASSWORD" type="password" autocomplete="new-password" placeholder="{{ 'Saved - leave blank to keep' if password_set else 'Enter SIP password' }}"></label>
    <button type="submit">Save SIP settings</button>
  </form>
</section>
{% endblock %}
